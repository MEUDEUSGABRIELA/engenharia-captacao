    status: pendente
    legenda: |
      "Posso levantar mais um andar na minha casa?" A resposta depende de duas coisas diferentes, e as pessoas só costumam pensar na primeira.

      A primeira é se a lei permite: o que a legislação de uso e ocupação do solo e o código de obras do município autorizam naquele terreno — recuos, taxa de ocupação, coeficiente de aproveitamento, gabarito.

      A segunda é se a estrutura aguenta. E essa ninguém responde olhando a casa de fora. Fundação e pilares foram dimensionados para a carga que existe hoje; um pavimento novo é carga nova em tudo que está embaixo.

      O caminho é sempre o mesmo: investigar o que existe, verificar a capacidade, e só então projetar o que vai subir — com memória de cálculo e ART.

      Está pensando em ampliar? WhatsApp (18) 99641-8959.

