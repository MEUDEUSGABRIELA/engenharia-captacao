      - "Fora do prazo, a\nempresa pode operar\nsem licença válida\nsem perceber"
      - "E operar sem licença\né infração ambiental,\nnão pendência\nadministrativa"
      - "Sabe quando a sua\nvence? (18) 99641-8959"
    status: pendente
    legenda: |
      Licença ambiental vencida quase nunca é descuido: é agenda.

      O pedido de renovação tem prazo próprio, que começa antes do fim da validade. Requerido dentro dele, a validade costuma ficar prorrogada até o órgão decidir — e a empresa segue operando regularmente.

      Perdido o prazo, a situação muda de natureza: a empresa passa a operar sem licença válida, muitas vezes sem perceber, porque nada acontece no dia seguinte. O que acontece é depois, e é infração ambiental — não pendência administrativa.

      Os prazos exatos variam conforme o órgão competente e o tipo de licença.

      Duas perguntas que valem a pena responder hoje: você sabe a data de vencimento da sua licença? E sabe quantos dias antes o pedido de renovação precisa entrar?

      Se a resposta a qualquer uma for "não", me chama: WhatsApp (18) 99641-8959.

