  - data: 2026-10-02
    pilar: servico
    segmento: sst
    formato: carrossel
    tema: Laudo de insalubridade, para que serve e quando a empresa precisa
    titulo: "Insalubridade não\nse decide no\nachismo"
    telas:
      - "Nem pelo que a\nempresa vizinha paga."
      - "O laudo mede a\nexposição real —\nruído, calor, químicos,\nbiológicos."
      - "Sem ele: paga-se\nadicional que talvez\nnão seja devido, ou\nnão se paga um que é."
      - "E ele aponta o que,\nresolvido no ambiente,\nfaz o adicional deixar\nde ser devido."
      - "Quer avaliar a sua?\n(18) 99641-8959"
    status: pendente
    legenda: |
      Insalubridade não se decide no achismo, nem pelo que a empresa vizinha paga.

      O laudo técnico é o que mede a exposição real — ruído, calor, agentes químicos, biológicos — e compara com os limites da NR-15 para dizer se existe insalubridade, em que grau, e o que elimina ou neutraliza.

      Por que a empresa deveria querer esse laudo:

      Sem ele, se paga adicional que talvez não seja devido — ou não se paga um que é, e isso volta como passivo trabalhista com juros.

      Ele aponta o que, resolvido no ambiente, faz o adicional deixar de ser devido. Isso é economia recorrente, não despesa.

      Quer avaliar a sua? WhatsApp (18) 99641-8959.

