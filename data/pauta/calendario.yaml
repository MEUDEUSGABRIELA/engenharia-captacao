  - data: 2026-09-28
    pilar: alerta-legal
    segmento: sst
    formato: estatico  # a arte da responsável técnica é uma peça só; a legenda cobre o resto
    tema: Quem está dispensado de PGR e quem só acha que está
    titulo: "\"Minha empresa é pequena,\nisso não se aplica a mim\""
    visual:
      tipo: comparacao
      esquerda:
        rotulo: A REGRA
        destaque: "Todo mundo\ngerencia risco"
        texto: "A organização deve implementar o gerenciamento de riscos das suas atividades (NR-1, item 1.5.3.1)."
      direita:
        rotulo: A EXCEÇÃO
        destaque: "Poucos são\ndispensados"
        texto: "MEI (1.8.1) e ME/EPP de grau 1 e 2 sem exposição declarada (1.8.4) — só do documento."
    status: pendente
    legenda: |
      "Minha empresa é pequena, isso não se aplica a mim."

      Se aplica quase sempre. A NR-1 é direta: a organização deve implementar o gerenciamento de riscos ocupacionais das suas atividades (item 1.5.3.1), e esse gerenciamento tem que constituir um PGR (item 1.5.3.1.1).

      A dispensa de elaborar o PGR existe, mas é exceção e tem endereço certo:

      MEI está dispensado de elaborar o PGR (item 1.8.1).

      Microempresa e empresa de pequeno porte de grau de risco 1 e 2 ficam dispensadas quando, no levantamento preliminar de perigos, não identificarem exposição a agentes físicos, químicos e biológicos e declararem as informações digitais na forma do item 1.6.1 (item 1.8.4).

      E o que quase ninguém lê: a dispensa alcança só a elaboração do documento — ela não afasta o cumprimento das demais disposições das NRs (item 1.8.5). Se há risco, há obrigação.

      Não sabe em qual caso a sua empresa está? Me chama no WhatsApp (18) 99641-8959 que eu te digo em cinco minutos.

  - data: 2026-09-29
    pilar: erro-caro
    segmento: civil
    formato: estatico  # a arte da responsável técnica é uma peça só
    tema: A parede que você não podia derrubar
    titulo: "O erro mais caro de reforma:\nderrubaram a parede errada"
    visual:
      tipo: comparacao
      esquerda:
        rotulo: VEDAÇÃO
        destaque: "Pode sair"
        texto: "Fecha o ambiente, mas não sustenta nada acima dela."
      direita:
        rotulo: ESTRUTURAL
        destaque: "Não pode sair"
        texto: "Sustenta laje, viga ou o pavimento de cima — e quase nunca se anuncia. Em construção antiga, menos ainda."
    status: pendente
    legenda: |
      O erro mais caro de reforma cabe numa frase: derrubaram a parede errada.

      Parede de vedação pode sair. Parede que está sustentando laje, viga ou o pavimento de cima, não — e ela quase nunca se anuncia. Em construção antiga, principalmente, a estrutura não está onde a gente espera.

      O que aparece depois: fissura em diagonal no canto das aberturas, porta que passa a raspar, piso do andar de cima cedendo. Quando chega nesse ponto, o conserto custa muitas vezes o valor do laudo que não foi feito.

      A verificação é rápida e acontece antes da marreta. Chama no WhatsApp (18) 99641-8959.

