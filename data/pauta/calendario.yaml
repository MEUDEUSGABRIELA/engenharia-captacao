  - data: 2026-10-06
    pilar: erro-caro
    segmento: sst
    formato: reels
    tema: PGR genérico comprado pronto não protege
    titulo: "Esse PGR não\nprotege a empresa\nque pagou por ele"
    ativo: "⟨PENDENTE: vídeo curto seu segurando um documento, em data/ativos/⟩"
    status: pendente
    legenda: |
      Existe PGR de tabela: troca o nome da empresa, muda o CNPJ, entrega. Barato e rápido.

      O problema aparece na fiscalização, porque o documento tem que corresponder à empresa real. Função que não existe ali, risco que existe e não está descrito, plano de ação sem prazo nem responsável, inventário que não conversa com o que se vê no chão: tudo isso é visível para quem lê por ofício.

      PGR é documento de responsabilidade técnica, com levantamento de campo por trás. Quando não tem, você pagou por um arquivo, não por proteção.

      Quer que eu olhe o seu? WhatsApp (18) 99641-8959.

