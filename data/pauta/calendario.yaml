      Pergunta que aparece toda semana: perito e assistente técnico são a mesma coisa?

      Não. E a diferença é estrutural.

      O perito judicial é nomeado pelo juízo e atua como auxiliar dele (CPC, art. 148). Não é da parte autora nem da ré. O compromisso é com a técnica, e é isso que dá valor ao laudo.

      O assistente técnico é indicado e contratado pela parte. Acompanha os trabalhos, pode apresentar parecer e manifestar-se sobre o laudo pericial.

      O que os dois têm em comum: ambos respondem tecnicamente pelo que assinam, e nenhum dos dois decide o mérito. Quem decide é o juízo.

      O engano que causa frustração: contratar assistente esperando que ele "conserte" um resultado. Ele não conserta — ele garante que a prova técnica seja completa e bem examinada, o que é diferente, e muitas vezes é o que faltava.

