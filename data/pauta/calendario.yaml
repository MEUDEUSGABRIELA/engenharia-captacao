  - data: 2026-10-15
    pilar: pergunta
    segmento: sst
    formato: estatico
    tema: Insalubridade e periculosidade, qual é a diferença
    titulo: "Insalubridade e\npericulosidade não\nsão a mesma coisa\n— e a confusão\ncusta caro"
    status: pendente
    legenda: |
      São adicionais diferentes, por motivos diferentes — e a confusão entre os dois custa caro na folha.

      Insalubridade: exposição a agente que faz mal à saúde ao longo do tempo. O adicional incide sobre o salário mínimo da região e é de 40% no grau máximo, 20% no médio e 10% no mínimo (NR-15, itens 15.2 a 15.2.3).

      Periculosidade: atividade de risco acentuado de acidente grave. O adicional é de 30% sobre o salário, sem gratificações, prêmios ou participação nos lucros (NR-16, item 16.2).

      Os dois não se somam: havendo direito aos dois, o empregado opta por um (NR-16, item 16.2.1). E com mais de um fator de insalubridade, considera-se só o de grau mais elevado, vedada a percepção cumulativa (NR-15, item 15.3).

      O que muita empresa não sabe: eliminar ou neutralizar a insalubridade faz cessar o pagamento do adicional (NR-15, item 15.4). É por isso que o laudo costuma se pagar.

      E quem caracteriza ou descaracteriza a periculosidade é laudo técnico de engenheiro de segurança do trabalho ou médico do trabalho (NR-16, item 16.3). Opinião, costume do setor e acordo verbal não sustentam nenhum dos dois.

      Quer a situação real da sua empresa? WhatsApp (18) 99641-8959.

  - data: 2026-10-16
    pilar: servico
    segmento: ambiental
    formato: carrossel
    tema: "Outorga de água: quem precisa e o que acontece sem ela"
    titulo: "Usar água de poço\nou de córrego pode\nexigir autorização\ndo Estado"
    telas:
      - "Outorga é o direito\nde uso da água —\na água é bem público,\nnão é do terreno."
      - "Costuma alcançar:\npoço, captação em curso\nd'água, lançamento\nde efluente."
      - "Sem ela: autuação,\nembargo do uso e\nproblema na renovação\nde licença."
      - "Quer saber se o seu\nuso precisa? \n(18) 99641-8959"
    status: pendente
    legenda: |
      Usar água de poço ou de córrego pode exigir autorização do Estado — e muita gente descobre isso na fiscalização.

      Outorga é o direito de uso de recurso hídrico. A água é bem público: ela não pertence ao dono do terreno onde nasce ou passa.

      Costuma alcançar poço, captação em curso d'água e lançamento de efluente. Os casos de dispensa e os limites de vazão são definidos pelo órgão gestor de recursos hídricos do Estado.

      Sem outorga: autuação, embargo do uso e problema na hora de renovar licença.

      Quer saber se o seu uso precisa? WhatsApp (18) 99641-8959.

