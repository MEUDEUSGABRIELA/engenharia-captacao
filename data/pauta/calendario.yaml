    legenda: |
      EPI entregue sem ficha assinada é, para todos os efeitos, EPI não entregue.

      Parece burocracia até o dia em que a empresa precisa provar que entregou. Na fiscalização e na reclamação trabalhista, o que não está registrado não aconteceu.

      A ficha registra qual EPI, qual CA, em que data, e a assinatura de quem recebeu. Sem isso, a defesa da empresa é a palavra dela contra a do trabalhador.

      Mas tem uma parte que pega mesmo quem tem as fichas em ordem: entregar não encerra a obrigação. A empresa também tem que exigir e fiscalizar o uso. EPI pendurado no prego não protege ninguém e não protege a empresa.

      E antes de tudo isso: o EPI tem que ser o adequado ao risco — o que exige saber qual é o risco, medido, e não escolhido por catálogo.

      Quer organizar isso de uma vez? WhatsApp (18) 99641-8959.

