# Blocos de hashtag. O motor monta 12 a 18 por post: sempre o bloco local + o bloco do segmento.
# Repetir o mesmo conjunto todo dia é padrão que o Instagram trata como spam — por isso o motor
# sorteia dentro de cada bloco a partir da data (mesma data, mesmo resultado: é reproduzível).

