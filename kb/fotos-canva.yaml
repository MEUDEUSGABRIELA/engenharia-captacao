# Identificadores das fotos da responsável técnica dentro da Canva.
#
# Por que este arquivo existe: a Canva permite **usar** um upload, mas não permite **listar** os
# uploads de uma conta. Sem os identificadores anotados, cada arte nova exigiria pedir à
# responsável técnica que arrastasse as fotos para dentro de um design de novo, só para poderem
# ser lidas. Subidos e conferidos em 23.09.2026.
#
# Uso: passar o `id` no campo `asset_ids` de `generate-design`, ou em `update_fill` ao trocar a
# imagem de um design existente.

