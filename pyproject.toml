[project]
name = "engenharia-captacao"
version = "0.1.0"
description = "Motor de conteúdo e publicação automática do Instagram @meudeusgabrielaengenharia"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "pillow-heif>=0.16",  # foto de iPhone é HEIC; sem isto o Pillow não abre
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
